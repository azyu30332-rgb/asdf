plugins { id 'com.android.application' }

android {
    namespace 'kr.chaekjang.app'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.chaekjang.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            def fixedStore = System.getenv('CHAEKJANG_KEYSTORE')
            if (fixedStore) storeFile file(fixedStore)
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// The same tested UI runs entirely from the APK; no server or network is used.
tasks.register('bundleWebApp', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'build-standalone.mjs'
    inputs.files('../../index.html', '../../style.css', '../../model.mjs', '../../storage.mjs', '../../app.js', '../../build-standalone.mjs')
    outputs.file('../../chaekjang.html')
}
tasks.register('syncWebAssets', Copy) {
    dependsOn 'bundleWebApp'
    from '../../chaekjang.html'
    into 'src/main/assets'
    rename { 'index.html' }
}
tasks.named('preBuild') { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}
