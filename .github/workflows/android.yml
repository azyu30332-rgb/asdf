name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Restore the legacy key if it exists, and explicitly use the cached path.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chaekjang-android-debug-key-v1
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chaekjang-explicit-signing-key-v2
      - name: Prepare persistent Android signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-android-signing.py
      - name: Install Android SDK components
        run: |
          test -d "$ANDROID_HOME"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test collection logic
        run: npm test
      - name: Build and lint APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug lintDebug
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chown "$USER" /dev/kvm
      - name: Test actual Android backup, restore and photos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: android
          script: python3 ../tests/run_android_device.py
      - name: Report Android test outcomes
        if: always()
        run: python3 tests/report_android.py
      - name: Verify installed version, UI assets and APK signature
        run: python3 tests/verify_apk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: chaekjang-android-package
          path: dist/android/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: chaekjang-android-package
          path: dist/android/
      - name: Publish uniquely named APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-android.sh
