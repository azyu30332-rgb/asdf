name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Keep personal test updates compatible while this cache remains available.
      # Production distribution needs a separately managed release signing key.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chaekjang-android-debug-key-v1
      - name: Install Android SDK components
        run: |
          test -d "$ANDROID_HOME"
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test collection logic
        run: npm test
      - name: Build and lint APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chaekjang-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
